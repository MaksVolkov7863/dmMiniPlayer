name: Build extension

on:
  push:
    branches: [main, master]
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm i

      - name: Build
        run: pnpm run build

      - name: Pack zip and xpi
        run: pnpm run archive

      - name: Upload zipped packages
        uses: actions/upload-artifact@v4
        with:
          name: dmMiniPlayer-packages-${{ github.sha }}
          path: |
            build/*.zip
            build/*.xpi
          if-no-files-found: error

      - name: Upload unpacked Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-unpacked-load-this-folder
          path: dist
          if-no-files-found: error

      - name: Write changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/getChangeLog.mjs > CHANGELOG.txt

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/*.xpi
            metafile-*.json
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: CHANGELOG.txt
